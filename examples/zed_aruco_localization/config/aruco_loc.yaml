# config/aruco_loc.yaml
# Parameters for ArUco localization

---
/**:
    ros__parameters:

      general:
        marker_count: 18             # Number of markers in the World
        marker_size: 0.762           # Width/Height of the ArUco markers [m]
        maximum_distance: 10.0        # Maximum distance of the target from the camera to consider it valid
        detection_rate: 1.0          # Maximum detection frequency for pose update
        camera_name: 'zed'           # Name of the camera to relocate
        world_frame_id: 'map'        # Frame id of the world frame
        refine_detection: false      # Keep false - subpixel refinement degrades results with motion blur

      # Quality filters to reject blurry, oblique, or poorly estimated detections.
      # Resolution is auto-detected from the image; the matching param set is selected automatically.
      # Shared params (resolution-independent):
      quality_filters:
        max_oblique_angle: 65.0        # Maximum viewing angle in degrees between marker normal and camera axis.
                                       # Beyond ~65 deg the marker is heavily foreshortened and corner
                                       # localization degrades. Increase to 70 if too aggressive.
        same_marker_cooldown: 5.0      # Cooldown in seconds before re-accepting the same marker for
                                       # pose reset, unless the new detection has a strictly better
                                       # (lower) reprojection error. A different marker is always
                                       # accepted immediately regardless of this cooldown.

      # HD1080 (1920x1080) — more pixels per marker, can afford slightly looser thresholds
      quality_filters_1080:
        min_laplacian_variance: 50.0   # Sharp markers typically 100-500+. Blurry drops below 30-50.
        max_reprojection_error: 2.0    # Good detections < 1.0 px. Above 2.0 = bad corners.
        min_marker_area: 2500.0        # ~50x50 px minimum. 0.762m marker at 7.5m ≈ 100px side.

      # HD720 (1280x720) — fewer pixels, tighter error budget, lower area threshold
      quality_filters_720:
        min_laplacian_variance: 40.0   # Slightly lower — smaller ROI has inherently less variance.
        max_reprojection_error: 1.5    # Each pixel = larger angular error at lower res, so tighter.
        min_marker_area: 1500.0        # ~39x39 px minimum. 0.762m marker at 7.5m ≈ 67px side.

      debug:
        active: false               # Enable debug messages

